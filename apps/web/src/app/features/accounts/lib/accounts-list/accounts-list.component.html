<div class="card">
    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>

    <p-toolbar styleClass="mb-4 gap-2">
        <ng-template pTemplate="left">
            <p-button
                label="New"
                icon="pi pi-plus"
                class="mr-2"
                (onClick)="openNew()"
            ></p-button>
        </ng-template>
    </p-toolbar>

    <p-table
        [value]="accounts"
        [rows]="10"
        [paginator]="true"
        [tableStyle]="{ 'min-width': '75rem' }"
        selectionMode="single"
        dataKey="id"
    >
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="name">Name <p-sortIcon field="name"></p-sortIcon></th>
                <th pSortableColumn="currency">Currency <p-sortIcon field="currency"></p-sortIcon></th>
                <th pSortableColumn="balance">Balance <p-sortIcon field="balance"></p-sortIcon></th>
                <th>Actions</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-account>
            <tr>
                <td>{{ account.name }}</td>
                <td>{{ account.currency }}</td>
                <td>{{ account.balance | currency:account.currency }}</td>
                <td>
                    <p-button
                        icon="pi pi-pencil"
                        class="mr-2"
                        [rounded]="true"
                        [outlined]="true"
                        severity="success"
                        (onClick)="editAccount(account)"
                    ></p-button>
                    <p-button
                        icon="pi pi-trash"
                        severity="danger"
                        [rounded]="true"
                        [outlined]="true"
                        (onClick)="deleteAccount(account)"
                    ></p-button>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <app-account-dialog
        [visible]="accountDialog"
        [account]="account"
        (visibleChange)="hideDialog()"
        (saved)="onSave()"
    ></app-account-dialog>
</div>
