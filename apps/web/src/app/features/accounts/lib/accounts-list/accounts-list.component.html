<app-page-layout
    title="Gestión de Cuentas"
    subtitle="Control centralizado de tus portafolios y capital disponible">

    <p-button
        actions
        label="Nueva Cuenta"
        icon="pi pi-plus"
        [rounded]="true"
        (onClick)="openNew()"
        class="primary-glow w-full sm:w-auto"
        [raised]="true"
    ></p-button>

    <p-toast></p-toast>
    <p-confirmDialog [appendTo]="'body'"></p-confirmDialog>
    <app-filter-toolbar (clear)="clearFilters()">
        <div start class="flex flex-wrap gap-4 items-center">
            <!-- Buscador -->
            <p-iftalabel>
                <input
                    pInputText
                    id="search"
                    [(ngModel)]="searchTerm"
                    placeholder="Nombre o Broker..."
                    class="w-64"
                    variant="filled"
                />
                <label for="search">Búsqueda</label>
            </p-iftalabel>

            <!-- Mercado -->
            <p-iftalabel>
                <p-select
                    id="market"
                    [options]="marketOptions"
                    [(ngModel)]="selectedMarket"
                    optionLabel="label"
                    optionValue="value"
                    placeholder="Cualquiera"
                    appendTo="body"
                    variant="filled"
                    styleClass="w-48"
                ></p-select>
                <label for="market">Mercado</label>
            </p-iftalabel>

            <!-- Tipo -->
            <p-iftalabel>
                <p-select
                    id="type"
                    [options]="typeOptions"
                    [(ngModel)]="selectedType"
                    optionLabel="label"
                    optionValue="value"
                    placeholder="Cualquiera"
                    appendTo="body"
                    variant="filled"
                    styleClass="w-48"
                ></p-select>
                <label for="type">Tipo de Cuenta</label>
            </p-iftalabel>

            <!-- Categoría -->
            <p-iftalabel>
                <p-select
                    id="category"
                    [options]="categoryOptions"
                    [(ngModel)]="selectedCategory"
                    optionLabel="label"
                    optionValue="value"
                    placeholder="Cualquiera"
                    appendTo="body"
                    variant="filled"
                    styleClass="w-48"
                ></p-select>
                <label for="category">Categoría</label>
            </p-iftalabel>

            <!-- Divisa -->
            <p-iftalabel>
                <p-select
                    id="currency"
                    [options]="currencyOptions"
                    [(ngModel)]="selectedCurrency"
                    optionLabel="label"
                    optionValue="value"
                    placeholder="Cualquiera"
                    appendTo="body"
                    variant="filled"
                    styleClass="w-32"
                ></p-select>
                <label for="currency">Divisa</label>
            </p-iftalabel>
        </div>
    </app-filter-toolbar>

    <div class="bullish-table-container">
        <p-table
            [value]="filteredAccounts()"
            [rows]="10"
            [paginator]="true"
            [size]="'small'"
            dataKey="id"
        >
            <ng-template pTemplate="header">
                <tr>
                    <th pSortableColumn="name">Nombre <p-sortIcon field="name"></p-sortIcon></th>
                    <th pSortableColumn="type">Tipo <p-sortIcon field="type"></p-sortIcon></th>
                    <th pSortableColumn="propFirmStatus">Categoría <p-sortIcon field="propFirmStatus"></p-sortIcon></th>
                    <th pSortableColumn="market">Mercado <p-sortIcon field="market"></p-sortIcon></th>
                    <th pSortableColumn="currency">Divisa <p-sortIcon field="currency"></p-sortIcon></th>
                    <th pSortableColumn="balance">Balance Actual <p-sortIcon field="balance"></p-sortIcon></th>
                    <th class="sticky-actions text-center">Acciones</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-account>
                <tr>
                    <td class="font-bold">{{ account.name }}</td>
                    <td class="text-muted">{{ getAccountTypeLabel(account.type) }}</td>
                    <td>
                        @if (account.type === 'PROP_FIRM' && account.propFirmStatus) {
                            <p-tag [value]="getPropFirmStatusLabel(account.propFirmStatus)" [severity]="getPropFirmStatusSeverity(account.propFirmStatus)"></p-tag>
                        } @else if (account.type === 'PERSONAL') {
                            <p-tag value="Real" severity="secondary"></p-tag>
                        } @else {
                            <span class="text-muted italic text-xs">Sin asignar</span>
                        }
                    </td>
                    <td><p-tag [value]="account.market" [severity]="getMarketSeverity(account.market)"></p-tag></td>
                    <td><p-tag [value]="account.currency" severity="secondary"></p-tag></td>
                    <td class="font-mono" [ngClass]="getBalanceClass(account)">
                        {{ account.balance | currency:account.currency }}
                    </td>
                    <td class="sticky-actions text-center">
                        <div class="flex justify-center gap-3">
                            <p-button
                                icon="pi pi-pencil"
                                [rounded]="true"
                                [text]="true"
                                severity="secondary"
                                (onClick)="editAccount(account)"
                            ></p-button>
                            <p-button
                                icon="pi pi-trash"
                                severity="danger"
                                [rounded]="true"
                                [text]="true"
                                (onClick)="deleteAccount(account)"
                            ></p-button>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>

    <app-account-dialog
        [visible]="accountDialog()"
        [account]="account"
        (visibleChange)="accountDialog.set($event)"
        (saved)="onSave()"
    ></app-account-dialog>
</app-page-layout>
