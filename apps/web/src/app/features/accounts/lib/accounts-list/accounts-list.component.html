<app-page-layout
    title="Gestión de Cuentas"
    subtitle="Control centralizado de tus portafolios y capital disponible">

    <p-button
        actions
        label="Nueva Cuenta"
        icon="pi pi-plus"
        [rounded]="true"
        (onClick)="openNew()"
        styleClass="primary-glow"
        class="w-full sm:w-auto"
    ></p-button>

    <p-toast></p-toast>
    <p-confirmDialog [appendTo]="'body'"></p-confirmDialog>

    <div class="bullish-table-container">
        <!-- ... existing table ... -->
        <p-table
            [value]="accounts()"
            [rows]="10"
            [paginator]="true"
            dataKey="id"
            styleClass="p-datatable-bullish p-datatable-sm"
            [responsiveLayout]="'scroll'"
        >
            <ng-template pTemplate="header">
                <tr>
                    <th pSortableColumn="name">Nombre <p-sortIcon field="name"></p-sortIcon></th>
                    <th pSortableColumn="type">Tipo <p-sortIcon field="type"></p-sortIcon></th>
                    <th pSortableColumn="market">Mercado <p-sortIcon field="market"></p-sortIcon></th>
                    <th pSortableColumn="currency">Divisa <p-sortIcon field="currency"></p-sortIcon></th>
                    <th pSortableColumn="balance">Balance Actual <p-sortIcon field="balance"></p-sortIcon></th>
                    <th class="sticky-actions text-center">Acciones</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-account>
                <tr>
                    <td class="font-bold text-lg">{{ account.name }}</td>
                    <td><span class="text-muted">{{ getAccountTypeLabel(account.type) }}</span></td>
                    <td><span class="badge" [ngClass]="getMarketBadgeClass(account.market)">{{ account.market }}</span></td>
                    <td><span class="badge badge-neutral">{{ account.currency }}</span></td>
                    <td class="font-mono text-xl" [ngClass]="getBalanceClass(account)">
                        {{ account.balance | currency:account.currency }}
                    </td>
                    <td class="sticky-actions text-center">
                        <div class="flex justify-center gap-3">
                            <p-button
                                icon="pi pi-pencil"
                                [rounded]="true"
                                [text]="true"
                                severity="secondary"
                                (onClick)="editAccount(account)"
                            ></p-button>
                            <p-button
                                icon="pi pi-trash"
                                severity="danger"
                                [rounded]="true"
                                [text]="true"
                                (onClick)="deleteAccount(account)"
                            ></p-button>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>

    <app-account-dialog
        [visible]="accountDialog()"
        [account]="account"
        (visibleChange)="accountDialog.set($event)"
        (saved)="onSave()"
    ></app-account-dialog>
</app-page-layout>
