<div
  class="flex justify-center items-center min-h-screen bg-surface-ground px-4"
>
  <p-card
    header="Iniciar Sesión"
    class="w-full max-w-[400px]"
    styleClass="shadow-lg"
  >
    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      class="flex flex-col gap-4"
    >
      <p-message
        *ngIf="error"
        severity="error"
        [text]="error"
        styleClass="w-full"
      ></p-message>

      <div class="field">
        <p-floatLabel>
          <input
            pInputText
            id="email"
            formControlName="email"
            class="w-full"
            [class.ng-dirty]="loginForm.get('email')?.touched"
          />
          <label for="email">Email</label>
        </p-floatLabel>
      </div>

      <div class="field mt-4">
        <p-floatLabel>
          <p-password
            id="password"
            formControlName="password"
            [feedback]="false"
            [toggleMask]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
          ></p-password>
          <label for="password">Contraseña</label>
        </p-floatLabel>
      </div>

      <p-button
        label="Entrar"
        type="submit"
        [loading]="false"
        [disabled]="loginForm.invalid"
        styleClass="w-full mt-2"
      ></p-button>

      <div class="text-center mt-3 text-sm">
        ó
        <a routerLink="/auth/register" class="text-primary hover:underline"
          >Regístrate aquí</a
        >
      </div>
    </form>
  </p-card>
</div>
