<div class="login-layout">
    <p-card header="Iniciar Sesión" styleClass="login-card shadow-lg">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

            <p-message *ngIf="error" severity="error" [text]="error" styleClass="full-width"></p-message>

            <div class="field">
                <p-floatLabel>
                    <input
                        pInputText
                        id="email"
                        formControlName="email"
                        class="full-width"
                        [class.ng-dirty]="loginForm.get('email')?.touched"
                    />
                    <label for="email">Email</label>
                </p-floatLabel>
            </div>

            <div class="field mt-4">
                <p-floatLabel>
                    <p-password
                        id="password"
                        formControlName="password"
                        [feedback]="false"
                        [toggleMask]="true"
                        styleClass="full-width"
                        inputStyleClass="full-width"
                    ></p-password>
                    <label for="password">Contraseña</label>
                </p-floatLabel>
            </div>

            <p-button
                label="Entrar"
                type="submit"
                [loading]="false"
                [disabled]="loginForm.invalid"
                styleClass="full-width mt-2"
            ></p-button>

            <div class="text-center mt-3 text-sm">
                ó <a routerLink="/auth/register" class="link">Regístrate aquí</a>
            </div>
        </form>
    </p-card>
</div>
