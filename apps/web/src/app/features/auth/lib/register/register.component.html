<div class="flex justify-center items-center min-h-screen bg-surface-ground px-4">
    <p-card header="Crear Cuenta" class="w-full max-w-[400px]" styleClass="shadow-lg">
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

            <p-message *ngIf="error" severity="error" [text]="error" styleClass="w-full"></p-message>

            <div class="field">
                <p-floatLabel>
                    <input
                        pInputText
                        id="email"
                        formControlName="email"
                        class="w-full"
                        [class.ng-dirty]="registerForm.get('email')?.touched"
                    />
                    <label for="email">Email</label>
                </p-floatLabel>
            </div>

            <div class="field mt-4">
                <p-floatLabel>
                    <p-password
                        id="password"
                        formControlName="password"
                        [toggleMask]="true"
                        [feedback]="true"
                        styleClass="w-full"
                        inputStyleClass="w-full"
                        promptLabel="Elige una contraseña"
                        weakLabel="Débil"
                        mediumLabel="Media"
                        strongLabel="Fuerte"
                    ></p-password>
                    <label for="password">Contraseña</label>
                </p-floatLabel>
                <small class="block mt-1 text-gray-500">Mínimo 8 caracteres</small>
            </div>

            <p-button
                label="Registrarse"
                type="submit"
                [loading]="loading"
                [disabled]="registerForm.invalid"
                styleClass="w-full mt-2"
            ></p-button>

            <div class="text-center mt-3 text-sm">
                ¿Ya tienes cuenta? <a routerLink="/auth/login" class="text-primary hover:underline">Inicia sesión</a>
            </div>
        </form>
    </p-card>
</div>
