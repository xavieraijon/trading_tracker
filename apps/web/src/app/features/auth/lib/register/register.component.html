<div class="auth-page-container">
    <!-- Background Elements -->
    <div class="auth-bg-gradient"></div>
    <div class="auth-floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="auth-card-wrapper glass-effect">
        <div class="auth-header text-center mb-8">
            <div class="auth-logo mb-3">🍌</div>
            <h2 class="text-3xl font-bold">Únete a la manada</h2>
            <p class="text-muted mt-2">Empieza a cultivar tus pips con BullishBanana</p>
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="flex flex-col">
            @if (error) {
                <div class="error-toast flex items-center gap-2 p-4 mb-6 text-sm rounded-xl">
                    <i class="pi pi-exclamation-circle font-bold"></i>
                    <span>{{ error }}</span>
                </div>
            }

            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <p-iconfield class="w-full">
                    <p-inputicon styleClass="pi pi-envelope" />
                    <input
                        pInputText
                        id="email"
                        formControlName="email"
                        placeholder="tu@email.com"
                        class="w-full"
                    />
                </p-iconfield>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <div class="w-full">
                    <p-password
                        id="password"
                        formControlName="password"
                        [toggleMask]="true"
                        placeholder="Mínimo 8 caracteres"
                        styleClass="w-full"
                        inputStyleClass="w-full"
                    >
                        <ng-template pTemplate="header">
                            <h6 class="mt-0 mb-2">Seguridad ante todo</h6>
                        </ng-template>
                    </p-password>
                </div>
            </div>

            <div class="flex items-center gap-3 py-3 mb-2">
                <i class="pi pi-check-circle text-primary text-base"></i>
                <span class="text-xs text-muted font-medium">Acepto los términos de trading responsable.</span>
            </div>

            <p-button
                label="Crear Cuenta"
                type="submit"
                [loading]="loading"
                [disabled]="registerForm.invalid"
                styleClass="w-full py-4 shadow-lg primary-glow"
            ></p-button>

            <div class="text-center mt-8 text-sm font-medium">
                ¿Ya eres un Pro?
                <a routerLink="/auth/login" class="text-primary hover:underline ml-1">Inicia sesión</a>
            </div>
        </form>
    </div>
</div>
