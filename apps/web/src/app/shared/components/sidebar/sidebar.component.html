<div class="sidebar-header flex items-center gap-3 mb-8 px-4 py-2 cursor-pointer transition-all duration-300" routerLink="/">
    <div class="logo-circle shrink-0 w-10 h-10 flex items-center justify-center bg-accent-color rounded-full shadow-[0_0_15px_var(--accent-glow)]">
        <span class="logo-emoji text-2xl">🍌</span>
    </div>
    <div class="brand-text overflow-hidden transition-all duration-300 whitespace-nowrap"
         [class.opacity-0]="app.sidebarActive()"
         [class.w-0]="app.sidebarActive()">
        <span class="app-name text-xl font-black text-secondary uppercase tracking-tighter">BullishBanana</span>
    </div>
</div>

<div class="sidebar-menu">
    <ul class="list-none p-0 m-0 overflow-hidden">
        @for (item of menuItems(); track item.label) {
            <li class="mb-1">
                <!-- Parent item (with or without children) -->
                @if (item.children) {
                    <!-- Collapsible group header -->
                    <button (click)="toggleFunding()"
                            class="w-full flex items-center px-4 py-3 cursor-pointer rounded-xl transition-all duration-200 hover:bg-surface-hover group text-muted border-none bg-transparent">
                        <i [class]="item.icon + ' text-xl shrink-0 group-hover:text-primary transition-colors duration-200'"></i>
                        <span class="ml-3 font-semibold brand-text overflow-hidden transition-all duration-300 whitespace-nowrap flex-1 text-left"
                              [class.opacity-0]="app.sidebarActive()"
                              [class.w-0]="app.sidebarActive()">
                            {{ item.label }}
                        </span>
                        <i class="pi text-xs transition-transform duration-200 shrink-0"
                           [class.pi-chevron-down]="fundingExpanded()"
                           [class.pi-chevron-right]="!fundingExpanded()"
                           [class.opacity-0]="app.sidebarActive()"
                           [class.w-0]="app.sidebarActive()"></i>
                    </button>

                    <!-- Children (animated collapse) -->
                    <ul class="list-none p-0 m-0 overflow-hidden transition-all duration-300"
                        [style.max-height]="fundingExpanded() ? '300px' : '0'"
                        [style.opacity]="fundingExpanded() ? '1' : '0'">
                        @for (child of item.children; track child.label) {
                            <li>
                                <a [routerLink]="child.routerLink"
                                   routerLinkActive="active-route"
                                   [routerLinkActiveOptions]="{ exact: child.routerLink[0] === '/funding' }"
                                   class="flex items-center pl-8 pr-4 py-2.5 cursor-pointer rounded-xl transition-all duration-200 hover:bg-surface-hover group text-muted no-underline">
                                    <i [class]="child.icon + ' text-base shrink-0 group-hover:text-primary transition-colors duration-200'"></i>
                                    <span class="ml-3 text-sm font-medium brand-text overflow-hidden transition-all duration-300 whitespace-nowrap"
                                          [class.opacity-0]="app.sidebarActive()"
                                          [class.w-0]="app.sidebarActive()">
                                        {{ child.label }}
                                    </span>
                                </a>
                            </li>
                        }
                    </ul>
                } @else {
                    <!-- Regular item (same as before) -->
                    <a [routerLink]="item.routerLink"
                       routerLinkActive="active-route"
                       class="flex items-center px-4 py-3 cursor-pointer rounded-xl transition-all duration-200 hover:bg-surface-hover group text-muted no-underline">
                        <i [class]="item.icon + ' text-xl shrink-0 group-hover:text-primary transition-colors duration-200'"></i>
                        <span class="ml-3 font-semibold brand-text overflow-hidden transition-all duration-300 whitespace-nowrap"
                              [class.opacity-0]="app.sidebarActive()"
                              [class.w-0]="app.sidebarActive()">
                             {{ item.label }}
                        </span>
                    </a>
                }
            </li>
        }
    </ul>
</div>
