<div class="sidebar-header flex items-center gap-3 mb-8 px-4 py-2 cursor-pointer transition-all duration-300" routerLink="/">
    <div class="logo-circle shrink-0 w-10 h-10 flex items-center justify-center bg-accent-color rounded-full shadow-[0_0_15px_var(--accent-glow)]">
        <span class="logo-emoji text-2xl">🍌</span>
    </div>
    <div class="brand-text overflow-hidden transition-all duration-300 whitespace-nowrap"
         [class.opacity-0]="app.sidebarActive()"
         [class.w-0]="app.sidebarActive()">
        <span class="app-name text-xl font-black text-secondary uppercase tracking-tighter">BullishBanana</span>
    </div>
</div>

<div class="sidebar-menu">
    <ul class="list-none p-0 m-0 overflow-hidden">
        @for (item of menuItems(); track item.label) {
            <li class="mb-1">
                <a [routerLink]="item.routerLink"
                   routerLinkActive="active-route"
                   class="flex items-center px-4 py-3 cursor-pointer rounded-xl transition-all duration-200 hover:bg-surface-hover group text-muted no-underline">
                    <i [class]="item.icon + ' text-xl shrink-0 group-hover:text-primary transition-colors duration-200'"></i>
                    <span class="ml-3 font-semibold brand-text overflow-hidden transition-all duration-300 whitespace-nowrap"
                          [class.opacity-0]="app.sidebarActive()"
                          [class.w-0]="app.sidebarActive()">
                         {{ item.label }}
                    </span>
                </a>
            </li>
        }
    </ul>

    <!-- Funding section: collapsible PanelMenu -->
    <div class="mt-1 sidebar-panel-menu"
         [class.collapsed-sidebar]="app.sidebarActive()">
        <p-panelmenu [model]="fundingMenuItems()" styleClass="sidebar-funding-menu" />
    </div>
</div>
